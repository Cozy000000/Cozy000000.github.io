<header class="site-header">
  <div class="header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Zhiyi Chen, home">zhiyi<span aria-hidden="true">.</span></a>
    <nav class="top-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}"{% if page.home %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' or page.layout == 'post' %} aria-current="page"{% endif %}>Blog</a>
      <a href="{{ '/drawing/' | relative_url }}"{% if page.url == '/drawing/' %} aria-current="page"{% endif %}>Diagram</a>
      <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" hidden><span class="theme-symbol" aria-hidden="true">◐</span></button>
    </nav>
  </div>
</header>
