<!doctype html>
<html lang="{{ page.lang | default: 'en' }}" data-theme="light">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>
  <body id="top"{% if page.home %} class="home-page"{% endif %}>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="reading-progress" aria-hidden="true"></div>
    {% include masthead.html %}
    <main id="main" class="site-main{% unless page.home %} inner-page{% endunless %}">
      {{ content }}
    </main>
    {% include footer.html %}
    {% include scripts.html %}
  </body>
</html>
