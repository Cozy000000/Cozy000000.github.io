---
layout: default
---
<article class="post">
  <header class="page-heading"><a class="eyebrow" href="{{ '/blog/' | relative_url }}">← All notes</a><h1>{{ page.title }}</h1><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %d, %Y' }}</time></header>
  <div class="prose post-content">{{ content }}</div>
</article>
